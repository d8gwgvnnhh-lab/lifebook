<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a68f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lifebook">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" id="touchicon" href="">
<title>Lifebook</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>">
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--panel2:#f0f2f5;--text:#1c2230;--muted:#687083;--border:#e2e5eb;
  --accent:#3a68f0;--accent-soft:#e8eefe;--danger:#d14343;--danger-soft:#fdeaea;
  --warn:#8a5a00;--warn-soft:#fff5dc;--ok:#1a8f4c;--ok-soft:#e3f6ea;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);--radius:12px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111419;--panel:#191d25;--panel2:#212633;--text:#e5e8ee;--muted:#98a1b1;--border:#2b3140;
  --accent:#7096ff;--accent-soft:#232d4a;--danger:#ff7070;--danger-soft:#3a1d22;
  --warn:#ffcd6b;--warn-soft:#352b12;--ok:#5fd394;--ok-soft:#15301f;--shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h1{font-size:24px;margin:0 0 4px;line-height:1.25}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}

/* layout */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{background:var(--panel);border-right:1px solid var(--border);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;padding:4px 8px 16px}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--text)}
.nav a:hover{background:var(--panel2);text-decoration:none}
.nav a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .count{margin-left:auto;font-size:12px;color:var(--muted)}
.content{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);display:flex;gap:10px;align-items:center;padding:12px 28px;border-bottom:1px solid var(--border)}
.searchwrap{flex:1;max-width:560px;position:relative}
.searchwrap input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--border);border-radius:10px;background:var(--panel)}
.searchwrap::before{content:"🔍";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.7}
.menu-btn{display:none}
main{padding:24px 28px 60px;max-width:1100px;width:100%}

/* components */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:16px}
.grid{display:grid;gap:14px}
.grid.cards{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.grid.tiles{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.sec-head h2{margin:0}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--panel);cursor:pointer;white-space:nowrap;color:var(--text)}
.btn:hover{background:var(--panel2);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:13px}
.link-btn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ticon{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:color-mix(in srgb,var(--c,#888) 18%,transparent);font-size:18px;flex:none}
.ticon.lg{width:46px;height:46px;font-size:24px;border-radius:12px}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;background:var(--panel2);border:1px solid var(--border);color:var(--text);white-space:nowrap}
a.chip:hover{text-decoration:none;border-color:var(--accent)}
.chip.tag{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.mandatory{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.chip.conditional{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.recommended{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.progress{height:7px;background:var(--panel2);border-radius:99px;overflow:hidden}
.progress>div{height:100%;background:var(--accent);border-radius:99px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:40px}
.notice{padding:12px 16px;border-radius:10px;background:var(--warn-soft);color:var(--warn);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.infobox{padding:12px 14px;border-radius:10px;background:var(--panel2);font-size:14px}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--danger)}

/* entry cards */
.ecard{display:block;color:var(--text);cursor:pointer;transition:border-color .15s}
.ecard:hover{border-color:var(--accent);text-decoration:none}
.ecard .t{font-weight:600;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis}
.ecard .m{font-size:13px;color:var(--muted);margin-bottom:8px}
.ecard .foot{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}

/* tiles & stats */
.tile{display:flex;gap:12px;align-items:center;color:var(--text)}
.tile:hover{border-color:var(--accent);text-decoration:none}
.stat{font-size:12px;color:var(--muted)}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stats .v{font-size:22px;font-weight:700}
.stats .l{font-size:12px;color:var(--muted)}

/* upcoming */
.up-row{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--border);color:var(--text)}
.up-row:last-child{border-bottom:0}
.up-row:hover{background:var(--panel2);text-decoration:none}
.datebox{width:50px;text-align:center;border-radius:9px;background:var(--panel2);padding:4px 0;flex:none;line-height:1.15}
.datebox .d{font-size:18px;font-weight:700}
.datebox .mo{font-size:11px;text-transform:uppercase;color:var(--muted)}
.up-row.overdue .datebox{background:var(--danger-soft);color:var(--danger)}
.up-row.soon .datebox{background:var(--warn-soft);color:var(--warn)}
.rel{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.up-row.overdue .rel{color:var(--danger);font-weight:600}

/* filters */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--border);background:var(--panel);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.toolbar select,.toolbar input{padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}

/* detail */
.dl{display:grid;grid-template-columns:minmax(120px,210px) 1fr;gap:0}
.dl>div{padding:8px 0;border-bottom:1px solid var(--border)}
.dl>.k{color:var(--muted);font-size:14px;padding-right:12px}
.dl>.v{white-space:pre-wrap;word-break:break-word}
.dl>div:nth-last-child(-n+2){border-bottom:0}
.grow-view{display:flex;flex-wrap:wrap;gap:4px 16px;padding:2px 0}
.grow-view+.grow-view{border-top:1px dashed var(--border);margin-top:4px;padding-top:6px}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.thumb{width:130px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--panel2);font-size:12px;color:var(--text)}
.thumb .img{height:95px;display:grid;place-items:center;font-size:34px;background:var(--panel2)}
.thumb img{width:100%;height:95px;object-fit:cover;display:block}
.thumb .nm{padding:6px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linklist a{display:flex;gap:10px;align-items:center;padding:7px 0;color:var(--text)}
.addr{font-size:16px;line-height:1.5;white-space:pre-line}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl td{padding:7px 4px;border-bottom:1px solid var(--border);vertical-align:middle}
table.tbl td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.tbl tr.total td{font-weight:700;border-bottom:0;border-top:2px solid var(--border)}
table.tbl .bar{height:6px;background:var(--panel2);border-radius:9px;overflow:hidden;min-width:60px}
table.tbl .bar>div{height:100%;background:var(--accent)}
.ins-row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border)}
.ins-row:last-child{border-bottom:0}
.ins-row .st{font-size:20px;line-height:1.2;width:24px;text-align:center;flex:none}
.ins-row .body{flex:1;min-width:0}
.ins-row.skip{opacity:.55}

/* forms */
.form .fsec{padding-top:6px}
.form .fsec+.fsec{border-top:1px solid var(--border);margin-top:10px;padding-top:20px}
.form .fsec>h2{margin-bottom:4px}
.form .sec-note{font-size:13px;color:var(--muted);margin:0 0 14px}
.form .field{display:block;margin-bottom:14px;border:0;padding:0;min-width:0}
.form .field>span,.form legend{display:block;font-weight:600;font-size:14px;margin-bottom:5px;padding:0}
.form .field small,.form legend small{font-weight:400;color:var(--muted)}
.form input[type=text],.form input[type=email],.form input[type=tel],.form input[type=url],.form input[type=number],.form input[type=date],.form input[type=search],.form input[type=password],.form select,.form textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:var(--panel)}
.form textarea{resize:vertical;min-height:80px}
.form input:focus,.form select:focus,.form textarea:focus,.searchwrap input:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:0;border-color:var(--accent)}
.form .check{display:flex;gap:8px;align-items:center;font-weight:400}
.form .radio{display:flex;gap:8px;align-items:center;margin:4px 0}
.rangewrap{display:flex;gap:12px;align-items:center}
.rangewrap input{flex:1}
.linkbox{border:1px solid var(--border);border-radius:9px;overflow:hidden}
.linkbox .lb-filter{border:0 !important;border-bottom:1px solid var(--border) !important;border-radius:0 !important}
.lb-list{max-height:190px;overflow:auto;padding:4px 0}
.lb-item{display:flex;gap:8px;align-items:center;padding:4px 11px;cursor:pointer;font-size:14px}
.lb-item:hover{background:var(--panel2)}
.lb-item small{color:var(--muted);margin-left:auto}
.group .grow{display:flex;gap:10px;align-items:flex-end;padding:10px 12px 0;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;background:var(--panel2)}
.group .grow-fields{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0 12px}
.group .grow .btn{margin-bottom:14px}
.addr-lookup{position:relative}
.addr-res{position:absolute;left:0;right:0;top:100%;z-index:10;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);margin-top:4px;overflow:hidden}
.addr-res button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;cursor:pointer;font-size:14px}
.addr-res button:hover{background:var(--accent-soft)}
.addr-status-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-4px 0 14px;font-size:14px}
.file-row{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:14px}
.file-row.removed{text-decoration:line-through;opacity:.55}
.sticky-actions{position:sticky;bottom:0;background:var(--panel);padding:14px 0 0;border-top:1px solid var(--border);margin-top:8px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 16px}
pre.out{white-space:pre-wrap;background:var(--panel2);padding:14px;border-radius:10px;font:13px/1.55 ui-monospace,Consolas,monospace;margin:0 0 12px}
mark{background:color-mix(in srgb,var(--accent) 25%,transparent);color:inherit;border-radius:3px}

/* sync, mail */
#syncchip{margin-left:auto}
#syncchip[hidden],#dirchip[hidden]{display:none}
#dirchip{margin-left:auto}
#dirchip:not([hidden])+#syncchip{margin-left:0}
.msg-row{display:block;padding:10px 4px;border-bottom:1px solid var(--border);color:var(--text)}
.msg-row:last-child{border-bottom:0}
.msg-row:hover{background:var(--panel2);text-decoration:none}
.msg-top{display:flex;gap:10px;align-items:baseline}
.msg-prev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail-body{white-space:pre-wrap;word-break:break-word;max-height:60vh;overflow:auto;background:var(--panel2);padding:14px;border-radius:10px;font-size:14px}
code{background:var(--panel2);padding:1px 6px;border-radius:5px;font-size:13px;word-break:break-all}
.steps{margin:0;padding-left:20px;line-height:1.8}
.snd-row{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--border)}
.snd-row:last-child{border-bottom:0}
.snd-ic{font-size:22px;width:28px;text-align:center;flex:none;line-height:1.3}
.snd-main{flex:1;min-width:0}
.snd-act{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:none}
.snd-act select{padding:4px 8px;border:1px solid var(--border);border-radius:8px;background:var(--panel);font-size:13px;max-width:220px}
@media (max-width:820px){.snd-row{flex-wrap:wrap}.snd-act{width:100%;align-items:flex-start;padding-left:40px}}

/* iPhone notch / home indicator */
.topbar{padding-top:max(12px,env(safe-area-inset-top))}
.sidebar{padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
main{padding-bottom:max(60px,env(safe-area-inset-bottom))}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.2)}
  body.nav-open .sidebar{transform:none}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:15}
  .menu-btn{display:inline-flex}
  .topbar{padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
  main{padding:18px 16px 60px}
  .grid2{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr}
  .dl>.k{border-bottom:0;padding-bottom:0}
  /* 16px verhindert, dass Safari auf dem iPhone in Felder hineinzoomt */
  input,select,textarea,.form input,.form select,.form textarea{font-size:16px !important}
  #syncchip span,#dirchip span{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="content">
    <div class="topbar">
      <button class="btn sm menu-btn" data-act="toggle-nav" aria-label="Menü">☰</button>
      <div class="searchwrap"><input id="q" type="search" placeholder="Alles durchsuchen…  ( / )" autocomplete="off"></div>
      <button class="btn sm" id="dirchip" data-act="dir-allow" hidden title="PC-Ordner: Zugriff bestätigen">📁 <span>PC-Ordner verbinden</span></button>
      <a class="btn sm" id="syncchip" href="#/sync" hidden></a>
    </div>
    <main id="main"></main>
  </div>
</div>
<div id="toast"></div>
<input type="file" id="vcfinput" accept=".vcf,text/vcard,text/x-vcard" hidden>

<script>
/* =====================================================================
   ANZEIGE-TEXTE FÜR AUSWAHLWERTE
   Gespeichert werden die (englischen) Werte links, angezeigt die deutschen
   Texte rechts. So bleiben bestehende Daten und die Synchronisierung gültig.
   ===================================================================== */
const DE = {
  // allgemein
  'Other': 'Sonstiges', 'Active': 'Aktiv', 'Done': 'Erledigt', 'Open': 'Offen',
  // Geschlecht
  'Female': 'Weiblich', 'Male': 'Männlich', 'Diverse / not specified': 'Divers / keine Angabe',
  // Gesundheit
  'Appointment': 'Termin', 'Medication': 'Medikament', 'Vaccination': 'Impfung', 'Check-up': 'Vorsorge / Check-up',
  'Condition': 'Erkrankung', 'Note': 'Notiz', 'Ongoing': 'Laufend',
  // Verträge
  'Insurance': 'Versicherung', 'Phone & Internet': 'Telefon & Internet', 'Streaming & Media': 'Streaming & Medien',
  'AI & Software': 'KI & Software', 'Subscription': 'Abo', 'Housing': 'Wohnen', 'Utilities': 'Energie & Nebenkosten',
  'Bank & Credit': 'Bank & Kredit', 'Leasing': 'Leasing', 'Cancelled': 'Gekündigt', 'Ended': 'Beendet',
  'Monthly': 'Monatlich', 'Quarterly': 'Vierteljährlich', 'Yearly': 'Jährlich', 'One-time': 'Einmalig',
  'Standard (free choice of doctor)': 'Standard (freie Arztwahl)', 'Family doctor (Hausarzt)': 'Hausarztmodell',
  'Statutory (GKV)': 'Gesetzlich (GKV)', 'Private (PKV)': 'Privat (PKV)',
  // Kontakte
  'Family': 'Familie', 'Friend': 'Freund/in', 'Work': 'Arbeit', 'Doctor': 'Arzt / Ärztin', 'Service': 'Dienstleister',
  // Dokumente
  'Email': 'E-Mail', 'Letter': 'Brief', 'Invoice': 'Rechnung', 'Receipt': 'Quittung / Beleg',
  'Contract document': 'Vertragsdokument', 'Certificate': 'Zertifikat / Urkunde',
  // Ziele & Ideen
  'Health': 'Gesundheit', 'Career': 'Karriere', 'Finance': 'Finanzen', 'Learning': 'Lernen', 'Relationships': 'Beziehungen',
  'Personal': 'Persönlich', 'Travel': 'Reisen', 'Idea': 'Idee', 'Paused': 'Pausiert',
  'Project': 'Projekt', 'Business': 'Geschäft', 'Gift': 'Geschenk', 'Purchase': 'Anschaffung',
  'New': 'Neu', 'Considering': 'In Überlegung', 'Doing': 'In Arbeit', 'Dropped': 'Verworfen',
  // Ausweise
  'Passport': 'Reisepass', 'Identity card': 'Identitätskarte', 'Driving licence': 'Führerausweis',
  'Residence permit B': 'Aufenthaltsbewilligung B', 'Settlement permit C': 'Niederlassungsbewilligung C',
  'Short-term permit L': 'Kurzaufenthaltsbewilligung L', 'Cross-border permit G': 'Grenzgängerbewilligung G',
  'Health insurance card': 'Krankenkassenkarte', 'AHV/AVS number': 'AHV-Nummer', 'Residence permit': 'Aufenthaltsbewilligung',
  'Passport (Reisepass)': 'Reisepass', 'Identity card (Personalausweis)': 'Personalausweis',
  'Driving licence (Führerschein)': 'Führerschein', 'Residence permit (Aufenthaltstitel)': 'Aufenthaltstitel',
  'Health card (eGK)': 'Gesundheitskarte (eGK)', 'Tax ID (Steuer-ID)': 'Steuer-ID', 'Social security number': 'Sozialversicherungsnummer',
  'Identity card (CNI)': 'Identitätskarte (CNI)', 'Residence permit (titre de séjour)': 'Aufenthaltstitel (titre de séjour)',
  'Identity card (CIE)': 'Identitätskarte (CIE)', 'Health card (Tessera sanitaria)': 'Gesundheitskarte (Tessera sanitaria)',
  'Tax code (Codice fiscale)': 'Steuernummer (Codice fiscale)', 'Residence permit / eVisa': 'Aufenthaltstitel / eVisa',
  'National Insurance number': 'National Insurance Number', 'Passport card': 'Passkarte', "Driver's license": 'Führerschein',
  'State ID': 'State ID', 'Green card': 'Green Card', 'Social Security number': 'Social Security Number',
};
const L = v => DE[v] ?? INS_NAMES[v] ?? v; // INS_NAMES (Versicherungsarten aller Länder) ist weiter unten definiert
const LOCALE = 'de-CH';

/* =====================================================================
   LÄNDERWISSEN
   Adressformat, PLZ-Regeln, Ausweistypen und Versicherungssystem pro Land.
   Die Versicherungsinfos sind eine allgemeine Orientierung, keine Beratung.
   ===================================================================== */

/* ===================================================================== */
let db = null; // null = Speicher blockiert, Daten nur im Arbeitsspeicher
const mem = { entries: new Map(), files: new Map(), meta: new Map() };
const keyOf = (name, v) => name === 'meta' ? v.key : v.id;
const state = { entries: [], meta: {} };

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('lifebook', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('entries', { keyPath: 'id' });
      d.createObjectStore('files', { keyPath: 'id' }).createIndex('entryId', 'entryId');
      d.createObjectStore('meta', { keyPath: 'key' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const store = (name, mode = 'readonly') => db.transaction(name, mode).objectStore(name);
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const dbAll = async name => db ? req(store(name).getAll()) : [...mem[name].values()];
const dbPut = async (name, v) => db ? req(store(name, 'readwrite').put(v)) : void mem[name].set(keyOf(name, v), v);
const dbDel = async (name, k) => db ? req(store(name, 'readwrite').delete(k)) : void mem[name].delete(k);
const dbClear = async name => db ? req(store(name, 'readwrite').clear()) : mem[name].clear();
const filesFor = async entryId => db ? req(store('files').index('entryId').getAll(entryId)) : [...mem.files.values()].filter(f => f.entryId === entryId);
/* Einstellungen, die zwischen Geräten synchronisiert werden; Schlüssel mit "_" bleiben nur auf diesem Gerät */
const SYNCED_META = ['name', 'currency', 'requests', 'senderPrefs', 'jarvisShare', 'jarvisInbox'];
async function setMeta(key, value) {
  state.meta[key] = value;
  await dbPut('meta', { key, value });
  if (SYNCED_META.includes(key)) {
    state.meta.settingsUpdated = new Date().toISOString();
    await dbPut('meta', { key: 'settingsUpdated', value: state.meta.settingsUpdated });
    scheduleSync();
  }
}
const clean = ({ _hay, _hayAt, ...e }) => e;
async function saveEntry(e) { e.updated = new Date().toISOString(); e._hay = null; await dbPut('entries', clean(e)); scheduleSync(); scheduleExtras(); }
/* Löschungen merken, damit andere Geräte beim Synchronisieren dasselbe löschen */
async function tombstone(kind, ids) {
  if (!ids.length) return;
  const key = kind === 'file' ? 'deletedFiles' : 'deleted';
  const t = { ...(state.meta[key] || {}) }, now = new Date().toISOString();
  ids.forEach(id => t[id] = now);
  state.meta[key] = t;
  await dbPut('meta', { key, value: t });
}

const isoOf = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const todayISO = () => isoOf(new Date());
const noYear = s => +String(s).slice(0, 4) < 1800; // iPhone speichert Geburtstage ohne Jahr als 1604
function timeAgo(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return 'gerade eben';
  if (s < 3600) return 'vor ' + Math.floor(s / 60) + ' Min.';
  if (s < 86400) return 'vor ' + Math.floor(s / 3600) + ' Std.';
  return 'am ' + fmtDate(iso.slice(0, 10));
}
const isoUTC = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const daysBetween = (a, b) => Math.round((isoUTC(b) - isoUTC(a)) / 86400000);
function fmtDate(s, opts = { day: 'numeric', month: 'short', year: 'numeric' }) {
  if (!s) return '';
  const [y, m, d] = s.split('-').map(Number);
  if (noYear(s)) { opts = { ...opts }; delete opts.year; delete opts.weekday; }
  return new Date(noYear(s) ? 2000 : y, m - 1, d).toLocaleDateString(LOCALE, opts);
}
function relDays(n) {

}
function ageOf(bday) {

function ask(message, okLabel = 'Ja, weiter') {
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:grid;place-items:center;padding:16px';
    wrap.innerHTML = `<div class="card" role="dialog" aria-modal="true" style="max-width:440px;width:100%">
      <p style="margin:0 0 16px">${h(message)}</p>
      <div class="actions" style="justify-content:flex-end"><button class="btn" data-a="no">Abbrechen</button><button class="btn primary" data-a="yes">${h(okLabel)}</button></div></div>`;
    const done = v => { wrap.remove(); document.removeEventListener('keydown', onKey, true); resolve(v); };
    const onKey = ev => { if (ev.key === 'Escape') { ev.stopPropagation(); done(false); } };
    wrap.addEventListener('click', ev => { const b = ev.target.closest('[data-a]'); if (b) done(b.dataset.a === 'yes'); else if (ev.target === wrap) done(false); });
    document.addEventListener('keydown', onKey, true);
    document.body.append(wrap);
    wrap.querySelector('[data-a=yes]').focus();

}
let objectURLs = [];
function freeURLs() { objectURLs.forEach(u => URL.revokeObjectURL(u)); objectURLs = []; }
function objURL(blob) { const u = URL.createObjectURL(blob); objectURLs.push(u); return u; }

function sectionsOf(t, d) {
  const out = [];
  for (const f of t.fields) {
    if (!visible(f, d)) continue;
    const name = f.section || '';
    let s = out.find(x => x.name === name);

/* ===================================================================== */
/* Erinnerungen                                                           */
/* ===================================================================== */
function reminders(ahead = 60, past = 30) {
  const out = [], t = todayISO(), thisYear = +t.slice(0, 4);
  for (const e of state.entries) {
    const tp = TOPIC[e.topic]; if (!tp) continue;
    const inactive = tp.inactive?.(e.data);
    // Datumswerte sammeln, auch aus wiederholbaren Gruppen
    const items = [];
    for (const f of tp.fields) {
      if (f.type === 'group') {
        for (const row of e.data[f.key] || []) for (const sf of f.fields) if (sf.remind && row[sf.key]) items.push({ f: sf, v: row[sf.key], label: f.rowLabel?.(row) });
      } else if (f.remind && e.data[f.key] && (!f.remindIf || f.remindIf(e.data))) items.push({ f, v: e.data[f.key] });
    }
    for (const { f, v, label } of items) {
      if (f.remind === 'yearly') {
        const [y, m, d] = v.split('-').map(Number);
        let occY = thisYear, occ = new Date(Date.UTC(occY, m - 1, d)).toISOString().slice(0, 10);
        if (occ < t) { occY++; occ = new Date(Date.UTC(occY, m - 1, d)).toISOString().slice(0, 10); }
        const diff = daysBetween(t, occ);
        if (diff <= ahead) {
          const age = y < 1800 ? 0 : occY - y;
          out.push({ e, tp, date: occ, diff, label: f.remindLabel || `Geburtstag von ${title(e)}`, note: age > 0 ? `${tp.single ? 'Du wirst' : 'Wird'} ${age}` : '' });
        }
      } else {
        if (inactive) continue;
        const diff = daysBetween(t, v);
        if (diff >= (f.futureOnly ? 0 : -past) && diff <= ahead)
          out.push({ e, tp, date: v, diff, label: label || (tp.single ? f.label : title(e)), note: tp.single ? '' : (f.remindNote?.(e.data) || f.label) });
      }
    }
  }
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

async function route() {

  const q = new URLSearchParams(qs || '');

    if (!a) { active = 'dashboard'; viewDashboard(); }
    else if (a === 'upcoming') { active = 'upcoming'; viewUpcoming(); }
    else if (a === 'topic' && TOPIC[b]) { active = 'topic:' + b; await viewTopic(TOPIC[b], q); }
    else if (a === 'entry' && byId(b)) { active = 'topic:' + byId(b).topic; await viewEntry(byId(b)); }
    else if (a === 'new' && TOPIC[b]) {
      active = 'topic:' + b;
      const existing = TOPIC[b].single && entriesOf(b)[0];
      await viewForm(TOPIC[b], existing || null, q);
    }
    else if (a === 'edit' && byId(b)) { active = 'topic:' + byId(b).topic; await viewForm(TOPIC[byId(b).topic], byId(b), q); }
    else if (a === 'search') { viewSearch(q.get('q') || ''); }
    else if (a === 'tags') { active = 'tags'; viewTags(); }
    else if (a === 'tag') { active = 'tags'; viewTag(b); }
    else if (a === 'request') { active = 'request'; viewRequest(); }
    else if (a === 'mail') { active = 'mail'; renderSidebar(active); b ? await viewMessage(b) : await viewMail(q); }
    else if (a === 'sync') { active = 'sync'; viewSync(); }
    else if (a === 'senders') { active = 'senders'; viewSenders(); }
    else if (a === 'jarvis') { active = 'jarvis'; viewJarvis(); }
    else if (a === 'vorschlaege') { active = 'vorschlaege'; viewSuggestions(); }
    else if (a === 'backup') { active = 'backup'; viewBackup(); }
    else { main.innerHTML = `<div class="card empty"><div class="big">🤷</div><p>Diese Seite gibt es nicht (mehr).</p><a class="btn" href="#/">Zur Übersicht</a></div>`; }
  } catch (err) {
    console.error(err);
    main.innerHTML = `<div class="card"><h2>Da ist etwas schiefgelaufen</h2><pre class="out">${h(err.stack || err)}</pre></div>`;
  }
  renderSidebar(active);
  if (a !== 'search' && !q.get('sec')) window.scrollTo(0, 0);
}

function topicIcon(t, cls = '') { return `<span class="ticon ${cls}" style="--c:${t.color}">${t.icon}</span>`; }

function upRow(r) {
  const cls = r.diff < 0 ? 'overdue' : r.diff <= 7 ? 'soon' : '';
  const d = r.date.split('-')[2];
  return `<a class="up-row ${cls}" href="#/entry/${r.e.id}">
    <div class="datebox"><div class="d">${+d}</div><div class="mo">${fmtDate(r.date, { month: 'short' })}</div></div>
    ${topicIcon(r.tp)}
    <div style="min-width:0"><div><b>${h(r.label)}</b></div><div class="small muted">${h(r.note)}${r.note ? ' · ' : ''}${fmtDate(r.date, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' })}</div></div>
    <div class="rel">${r.diff < 0 ? 'überfällig · ' : ''}${relDays(r.diff)}</div></a>`;

function backupNotice() {
  if (!state.entries.length || syncConfigured()) return '';

  if (days !== null && days < 14) return '';
  return `<div class="notice"><span>💾 ${last ? `Dein letztes Backup ist ${days} Tage alt.` : 'Du hast noch kein Backup gemacht.'} Deine Daten liegen nur in diesem Browser. Sichere sie ab und zu, oder richte die Synchronisierung ein.</span><a class="btn sm" href="#/backup">Jetzt sichern</a></div>`;
}

    return;
  }
  const all = entriesOf(t.id);
  const filterF = t.fields.find(f => f.key === t.filterField);

function displayValue(f, v, d = {}) {
  if (v === '' || v == null || v === false || (Array.isArray(v) && !v.length)) return '';
  switch (f.type) {
    case 'date': return noYear(v) ? h(fmtDate(v)) : `${h(fmtDate(v))} <span class="muted small">(${relDays(daysBetween(todayISO(), v))})</span>`;
    case 'money': return h(fmtMoney(v));
    case 'number': return h(v) + (f.unit ? ' ' + h(f.unit) : '');
    case 'checkbox': return 'Ja';
    case 'phone': return `<a href="tel:${h(v)}">${h(v)}</a>`;
    case 'email': return `<a href="mailto:${h(v)}">${h(v)}</a>`;
    case 'url': { const u = /^https?:\/\//i.test(v) ? v : 'https://' + v; return `<a href="${h(u)}" target="_blank" rel="noopener">${h(v)} ↗</a>`; }
    case 'country': { const c = COUNTRIES[v]; return c ? `${c.flag} ${h(c.name)}` : h(v); }
    case 'select': { const o = (optionsOf(f, d) || []).find(o => optVal(o) === v); return `<span class="chip">${h(o ? optLabel(o) : L(v))}</span>`; }
    case 'rating': return `<span title="${v}/5">${'★'.repeat(v)}<span class="muted">${'★'.repeat(5 - v)}</span></span>`;
    case 'progress': return `<div style="display:flex;gap:10px;align-items:center"><div class="progress" style="flex:1;max-width:260px"><div style="width:${v}%"></div></div><b>${v}%</b></div>`;
    case 'link': return `<div class="chips">${v.map(byId).filter(Boolean).map(x => `<a class="chip" href="#/entry/${x.id}">${TOPIC[x.topic].icon} ${h(title(x))}</a>`).join('')}</div>`;
    case 'group': return v.map(r => `<div class="grow-view">${f.fields.map(sf => { const x = displayValue(sf, r[sf.key], d); return x ? `<span><span class="muted small">${h(sf.label)}:</span> ${x}</span>` : ''; }).join('')}</div>`).join('');
    default: return linkify(h(v));
  }
}
const linkify = s => s.replace(/https?:\/\/[^\s<>"']+/g, u => { const clean = u.replace(/[.,;:)]+$/, ''); return `<a href="${clean}" target="_blank" rel="noopener">${clean} ↗</a>${u.slice(clean.length)}`; });

async function viewEntry(e) {
  const t = TOPIC[e.topic];
  const d = e.data;
  const related = (e.related || []).map(byId).filter(Boolean);
  const back = backlinks(e.id);
  const sections = sectionsOf(t, d).map(s => {
    const rows = s.fields.filter(f => !['custom', 'hidden'].includes(f.type) && !f.hideInDetail)
      .map(f => [f, displayValue(f, d[f.key], d)]).filter(([, v]) => v);
    const custom = s.fields.filter(f => f.type === 'custom' && f.detail).map(f => f.detail(e)).join('');
    const extra = t.sectionExtra?.[s.name]?.(e) || '';
    const body = (rows.length ? `<div class="dl">${rows.map(([f, v]) => `<div class="k">${h(lbl(f, d))}</div><div class="v">${v}</div>`).join('')}</div>` : '') + extra + custom;
    const editable = s.fields.some(f => !['custom', 'hidden'].includes(f.type));
    return `<div class="card">
      ${s.name ? `<div class="sec-head"><h2>${h(s.name)}</h2>${editable ? `<a class="btn sm" href="#/edit/${e.id}?sec=${slug(s.name)}">✏️ Bearbeiten</a>` : ''}</div>` : ''}
      ${body || `<p class="muted small" style="margin:0">Noch nichts ausgefüllt. <a href="#/edit/${e.id}?sec=${slug(s.name)}">Jetzt ergänzen</a></p>`}
    </div>`;
  });
  main.innerHTML = `
    <div class="page-head">
      <div style="display:flex;gap:14px;align-items:center">${topicIcon(t, 'lg')}<div>
        <div class="small muted"><a href="#/topic/${t.id}">${h(t.name)}</a></div>
        <h1>${h(title(e))}</h1></div></div>
      <div class="actions"><a class="btn primary" href="#/edit/${e.id}">✏️ ${t.single ? 'Alles bearbeiten' : 'Bearbeiten'}</a><button class="btn danger" data-act="delete" data-id="${e.id}">Löschen</button></div>
    </div>
    <div class="stack">
      ${sections.join('')}
      ${(e.tags || []).length ? `<div class="chips">${e.tags.map(x => `<a class="chip tag" href="#/tag/${encodeURIComponent(x)}">#${h(x)}</a>`).join('')}</div>` : ''}
      <div class="card" id="files"><h2>📎 Anhänge</h2><p class="muted small">Wird geladen…</p></div>
      ${related.length || back.length ? `<div class="card"><h2>🔗 Verknüpfungen</h2>
        ${related.length ? `<h3 class="muted small">Verknüpft mit</h3><div class="linklist">${related.map(x => `<a href="#/entry/${x.id}">${topicIcon(TOPIC[x.topic])}${h(title(x))}<span class="rel">${h(TOPIC[x.topic].name)}</span></a>`).join('')}</div>` : ''}
        ${back.length ? `<h3 class="muted small" style="margin-top:10px">Erwähnt in</h3><div class="linklist">${back.map(x => `<a href="#/entry/${x.id}">${topicIcon(TOPIC[x.topic])}${h(title(x))}<span class="rel">${h(TOPIC[x.topic].name)}</span></a>`).join('')}</div>` : ''}
      </div>` : ''}
      <p class="small muted">Erstellt am ${fmtDate(e.created.slice(0, 10))} · Zuletzt geändert ${new Date(e.updated).toLocaleString(LOCALE)}</p>
    </div>`;
  const files = await filesFor(e.id);
  const box = $('#files'); if (!box) return;
  box.innerHTML = `<h2>📎 Anhänge</h2>` + (files.length ? `<div class="thumbs">${files.map(f => {
    const u = objURL(f.blob);
    const isImg = f.type.startsWith('image/');
    return `<a class="thumb" href="${u}" target="_blank" download="${h(f.name)}" title="${h(f.name)}">${isImg ? `<img src="${u}" alt="">` : `<div class="img">${f.type === 'application/pdf' ? '📕' : '📄'}</div>`}<div class="nm">${h(f.name)}</div></a>`;
  }).join('')}</div>` : `<p class="muted small" style="margin:0">Keine Dateien. Über <a href="#/edit/${e.id}">Bearbeiten</a> kannst du Scans, Fotos oder PDFs anhängen (z.B. einen Scan deines Ausweises).</p>`);
}

function formatAddress(d) {
  const c = countryOf(d);
  const line1 = c.numberFirst ? [d.houseNo, d.street] : [d.street, d.houseNo];
  const l1 = line1.filter(Boolean).join(' ');
  const l2 = d.country === 'US' ? `${d.city || ''}${d.region ? ', ' + d.region : ''} ${d.zip || ''}`.trim()
    : d.country === 'GB' ? [d.city, (d.zip || '').toUpperCase()].filter(Boolean).join('\n')
    : [d.zip, d.city].filter(Boolean).join(' ') + (d.region && d.country !== 'US' ? ` ${d.region}` : '');
  return [l1, l2, d.country && d.country !== 'OTHER' && (l1 || l2) ? c.name : ''].filter(Boolean).join('\n');
}
function verifiedText(v) {
  if (!v) return '';
  const [src, date] = v.split('|');
  return src === 'swisstopo' ? `✅ Im amtlichen Gebäudeadressverzeichnis der Schweiz (swisstopo) bestätigt, ${fmtDate(date)}`
    : `✅ Auf OpenStreetMap gefunden, ${fmtDate(date)}`;
}
function addressDetail(e) {
  const d = e.data, txt = formatAddress(d);
  if (!d.street && !d.city) return '';
  const zipBad = d.zip && countryOf(d).zip && !countryOf(d).zip.test(d.zip);
  return `<div class="addr">${h(txt)}</div>
    <div class="actions small" style="margin-top:8px">
      ${d.addressVerified ? `<span class="ok">${verifiedText(d.addressVerified)}</span>` : `<span class="warn">⚠️ Noch nicht geprüft. Nutze beim Bearbeiten „Adresse prüfen".</span>`}
      ${zipBad ? `<span class="bad">⚠️ ${h(countryOf(d).zipLabel)} sollte ${h(countryOf(d).zipHint)} haben</span>` : ''}
      <a href="https://www.openstreetmap.org/search?query=${encodeURIComponent(txt.replace(/\n/g, ', '))}" target="_blank" rel="noopener">Auf Karte zeigen ↗</a>
    </div>`;
}
function budgetDetail(e) {
  const d = e.data;
  const income = Number(d.income) || 0;
  const rows = BUDGET.map(([k, l, i]) => [`${i} ${l}`, Number(d[k]) || 0]).filter(r => r[1]);
  const fixed = entriesOf('contracts').filter(isActiveContract).reduce((s, x) => s + monthlyCost(x.data), 0);
  if (!rows.length && !income && !fixed) return '';
  const variable = rows.reduce((s, r) => s + r[1], 0);
  const total = variable + fixed, left = income - total;
  const pct = v => income ? Math.round(v / income * 100) : 0;
  const row = (label, v) => `<tr><td>${label}</td><td style="width:35%">${income ? `<div class="bar"><div style="width:${Math.min(100, pct(v))}%"></div></div>` : ''}</td><td class="num muted small">${income ? pct(v) + '%' : ''}</td><td class="num">${h(fmtMoney(v))}</td></tr>`;
  return `<table class="tbl">
    ${income ? `<tr><td><b>💼 Nettoeinkommen</b></td><td></td><td></td><td class="num"><b>${h(fmtMoney(income))}</b></td></tr>` : ''}
    ${rows.map(([l, v]) => row(h(l), v)).join('')}
    ${row(`🔁 Fixkosten <a class="small" href="#sec-recurring-charges">(wiederkehrende Kosten)</a>`, fixed)}
    <tr class="total"><td>Total geplant</td><td></td><td class="num small">${income ? pct(total) + '%' : ''}</td><td class="num">${h(fmtMoney(total))}</td></tr>
    ${income ? `<tr><td><b>${left >= 0 ? '✅ Bleibt übrig' : '⚠️ Über Budget'}</b></td><td></td><td></td><td class="num ${left >= 0 ? 'ok' : 'bad'}"><b>${h(fmtMoney(left))}</b></td></tr>` : ''}
  </table>`;
}

function insuranceStatus() {

  const skip = prof.data.insuranceSkip || [];

    const has = contracts.filter(x => x.data.insuranceType === i.key);

    return { i, has, st };

/* ---------- Adresssuche (sendet nur, was du ins Suchfeld tippst) ---------- */
function addressLookupForm(d) {
  const c = countryOf(d);
  const src = c.lookup === 'swisstopo' ? 'dem amtlichen Gebäudeadressverzeichnis der Schweiz (swisstopo)' : 'OpenStreetMap (Photon)';
  return `<span>🔎 Adresse suchen <small>(automatische Vervollständigung)</small></span>
    <div class="addr-lookup"><input type="search" id="addrq" placeholder="Tippe los, z.B. ${h(c.example)}" autocomplete="off"><div id="addrres" class="addr-res" hidden></div></div>
    <div class="small muted" style="margin-top:4px">Die Vorschläge kommen aus ${src}. Gesendet wird nur der Text, den du in dieses Feld tippst.</div>`;
}
function addressStatusForm(d) {
  return `<div class="addr-status-row"><span id="addrstatus">${addrStatusHTML(d.addressVerified)}</span><button type="button" class="btn sm" data-act="addr-check">✓ Adresse prüfen</button></div>`;
}
const addrStatusHTML = v => v ? `<span class="ok">${verifiedText(v)}</span>` : `<span class="muted">Nicht geprüft</span>`;
const normAddr = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss').replace(/str\.?(\s|$)/g, 'strasse$1').replace(/[^a-z0-9]/g, '');
async function addressSearch(text, cc) {
  const c = COUNTRIES[cc] || COUNTRIES.OTHER;
  if (c.lookup === 'swisstopo') {
    const r = await fetch('https://api3.geo.admin.ch/rest/services/api/SearchServer?type=locations&origins=address&limit=8&searchText=' + encodeURIComponent(text)).then(r => r.json());
    return (r.results || []).map(x => {
      const label = x.attrs.label.replace(/<[^>]+>/g, '').trim();
      const m = label.match(/^(.*)\s(\d{4})\s(.+)$/); if (!m) return null;
      const sm = m[1].match(/^(.*?)\s+(\d+\s?[a-zA-Z]?(?:\.\d+)?)$/);
      return { street: sm ? sm[1] : m[1], houseNo: sm ? sm[2] : '', zip: m[2], city: m[3], region: (x.attrs.detail || '').split(' ').pop().toUpperCase(), source: 'swisstopo' };
    }).filter(Boolean);
  }
  const q = cc && cc !== 'OTHER' ? `${text}, ${c.name}` : text;
  const r = await fetch('https://photon.komoot.io/api/?limit=15&q=' + encodeURIComponent(q)).then(r => r.json());
  return (r.features || []).map(f => f.properties)
    .filter(p => !cc || cc === 'OTHER' || (p.countrycode || '').toUpperCase() === cc)
    .map(p => ({ street: p.street || (p.type === 'street' ? p.name : ''), houseNo: p.housenumber || '', zip: p.postcode || '', city: p.city || p.town || p.village || p.locality || '', region: '', source: 'osm' }))
    .filter(a => a.street || a.city).slice(0, 8);
}
const addrLine = a => `${COUNTRIES[curCountry()]?.numberFirst ? [a.houseNo, a.street] : [a.street, a.houseNo]}`.replace(/,/g, ' ').trim() + (a.zip || a.city ? ', ' : '') + [a.zip, a.city].filter(Boolean).join(' ');
const curCountry = () => $('#entryform')?.elements.f_country?.value || '';
let addrTimer, addrResults = [];
function showAddrResults(list, msg = '') {
  const box = $('#addrres'); if (!box) return;
  addrResults = list;
  box.hidden = !list.length && !msg;
  box.innerHTML = (msg ? `<div class="small muted" style="padding:8px 12px">${msg}</div>` : '') + list.map((a, i) => `<button type="button" data-act="addr-pick" data-i="${i}">📍 ${h(addrLine(a))}</button>`).join('');
}
async function addrInput(v) {
  clearTimeout(addrTimer);
  if (v.trim().length < 3) return showAddrResults([]);
  addrTimer = setTimeout(async () => {
    try { const list = await addressSearch(v, curCountry()); showAddrResults(list, list.length ? '' : 'Keine passende Adresse gefunden.'); }
    catch { showAddrResults([], 'Die Adresssuche ist gerade nicht erreichbar (offline?). Du kannst die Adresse auch von Hand eintippen.'); }
  }, 300);
}
function addrPick(a) {
  const f = $('#entryform').elements;
  f.f_street.value = a.street; f.f_houseNo.value = a.houseNo; f.f_zip.value = a.zip; f.f_city.value = a.city;
  if (a.region && f.f_region && [...(f.f_region.options || [])].some(o => o.value === a.region)) f.f_region.value = a.region;
  f.f_addressVerified.value = a.street && a.houseNo ? `${a.source}|${todayISO()}` : '';
  $('#addrstatus').innerHTML = addrStatusHTML(f.f_addressVerified.value) + (a.houseNo ? '' : ' <span class="warn">Bitte ergänze die Hausnummer.</span>');
  $('#addrq').value = ''; showAddrResults([]);
}
async function addrCheck() {
  const f = $('#entryform').elements;
  const a = { street: f.f_street.value.trim(), houseNo: f.f_houseNo.value.trim(), zip: f.f_zip.value.trim(), city: f.f_city.value.trim() };
  if (!a.street || !a.city && !a.zip) return toast('Gib zuerst mindestens Strasse und PLZ oder Ort ein');
  $('#addrstatus').innerHTML = '<span class="muted">Wird geprüft…</span>';
  try {
    const list = await addressSearch(`${a.street} ${a.houseNo} ${a.zip} ${a.city}`, curCountry());
    const match = list.find(x => normAddr(x.street) === normAddr(a.street) && normAddr(x.houseNo) === normAddr(a.houseNo) && (!a.zip || x.zip === a.zip || !x.zip));
    if (match) {
      f.f_addressVerified.value = `${match.source}|${todayISO()}`;
      if (!a.zip && match.zip) f.f_zip.value = match.zip;
      $('#addrstatus').innerHTML = addrStatusHTML(f.f_addressVerified.value);
    } else {
      f.f_addressVerified.value = '';
      $('#addrstatus').innerHTML = `<span class="bad">⚠️ Diese Adresse wurde so nicht gefunden.</span> ${list.length ? 'Meintest du eine dieser Adressen?' : 'Prüfe Schreibweise und Hausnummer.'}`;
      showAddrResults(list);
      $('#addrq')?.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  } catch { $('#addrstatus').innerHTML = '<span class="warn">Die Adressprüfung ist gerade nicht erreichbar (offline?).</span>'; }
}

/* ---------- Formular ---------- */
let formFiles = { pending: [], removed: new Set(), existing: [] };
let formCtx = null;

function linkBox(name, candidates, selected) {
  const sel = new Set(selected || []);
  const list = [...candidates].sort((a, b) => (sel.has(b.id) - sel.has(a.id)) || title(a).localeCompare(title(b)));
  return `<div class="linkbox" data-link="${name}">
    ${list.length > 6 ? `<input type="search" class="lb-filter" placeholder="Filtern…">` : ''}
    <div class="lb-list">${list.length ? list.map(e => `<label class="lb-item"><input type="checkbox" name="${name}" value="${e.id}" ${sel.has(e.id) ? 'checked' : ''}><span>${TOPIC[e.topic].icon} ${h(title(e))}</span><small>${h(TOPIC[e.topic].name)}</small></label>`).join('')
      : `<div class="small muted" style="padding:6px 11px">Noch nichts zum Verknüpfen vorhanden.</div>`}</div></div>`;
}

function inputFor(f, v, d, n = 'f_' + f.key) {
  v = v ?? '';
  const phv = typeof f.placeholder === 'function' ? f.placeholder(d) : f.placeholder;
  const ph = phv ? ` placeholder="${h(phv)}"` : '';
  const rr = f.rerender ? ' data-rerender' : '';
  switch (f.type) {
    case 'textarea': return `<textarea name="${n}" rows="3"${ph}>${h(v)}</textarea>`;
    case 'number': return `<input type="number" step="any" name="${n}" value="${h(v)}"${ph}>`;
    case 'money': return `<input type="number" step="0.01" inputmode="decimal" name="${n}" value="${h(v)}" placeholder="0.00">`;
    case 'date': return `<input type="date" name="${n}" value="${h(v)}">`;
    case 'phone': return `<input type="tel" name="${n}" value="${h(v)}"${ph}>`;
    case 'email': return `<input type="email" name="${n}" value="${h(v)}"${ph}>`;
    case 'url': return `<input type="text" inputmode="url" name="${n}" value="${h(v)}" placeholder="https://…">`;
    case 'checkbox': return `<label class="check"><input type="checkbox" name="${n}" ${v ? 'checked' : ''}> Ja</label>`;
    case 'country': return `<select name="${n}"${rr}><option value="">— wählen —</option>${countryOptions.map(o => `<option value="${o.value}" ${o.value === v ? 'selected' : ''}>${h(o.label)}</option>`).join('')}</select>`;
    case 'select': {
      const opts = optionsOf(f, d);
      if (!opts) return `<input type="text" name="${n}" value="${h(v)}"${ph}>`;
      const known = opts.some(o => optVal(o) === v);
      return `<select name="${n}"${rr}><option value="">—</option>${opts.map(o => `<option value="${h(optVal(o))}" ${optVal(o) === v ? 'selected' : ''}>${h(optLabel(o))}</option>`).join('')}${v && !known ? `<option selected value="${h(v)}">${h(L(v))}</option>` : ''}</select>`;
    }
    case 'rating': return `<select name="${n}"><option value="">—</option>${[1, 2, 3, 4, 5].map(i => `<option value="${i}" ${+v === i ? 'selected' : ''}>${'★'.repeat(i)}${'☆'.repeat(5 - i)}</option>`).join('')}</select>`;
    case 'progress': return `<div class="rangewrap"><input type="range" min="0" max="100" step="5" name="${n}" value="${+v || 0}" oninput="this.nextElementSibling.textContent=this.value+'%'"><b>${+v || 0}%</b></div>`;
    case 'link': return linkBox(n, state.entries.filter(e => f.to.includes(e.topic)), v);
    case 'group': {
      const rows = Array.isArray(v) ? v : [];
      return `<div class="group" data-group="${f.key}">${rows.map((r, i) => `<div class="grow"><div class="grow-fields">${f.fields.map(sf =>
        `<label class="field"><span>${h(sf.label)}</span>${inputFor(sf, r[sf.key], d, `g_${f.key}_${i}_${sf.key}`)}</label>`).join('')}</div>
        <button type="button" class="btn sm danger" data-act="grow-del" data-g="${f.key}" data-i="${i}" title="Entfernen">✕</button></div>`).join('')}
        <button type="button" class="btn sm" data-act="grow-add" data-g="${f.key}">＋ ${h(f.addLabel || 'Hinzufügen')}</button></div>`;
    }
    default: {
      const sug = f.suggest?.(d) || [];
      return `<input type="text" name="${n}" value="${h(v)}"${ph}${sug.length ? ` list="dl_${f.key}" autocomplete="off"` : ''}>${sug.length ? `<datalist id="dl_${f.key}">${sug.map(s => `<option value="${h(s)}">`).join('')}</datalist>` : ''}`;
    }
  }
}
const parseVal = (f, v) => ['number', 'money', 'rating', 'progress'].includes(f.type) ? (v === '' ? '' : Number(v)) : v;

/* sichtbare Felder lesen; gerade ausgeblendete Felder behalten ihren bisherigen Wert */
function readForm(form, t, base) {
  const fd = new FormData(form);
  const d = { ...base };
  for (const f of t.fields) {
    const n = 'f_' + f.key;
    if (f.type === 'custom') continue;
    if (f.type === 'group') {
      const el = form.querySelector(`.group[data-group="${f.key}"]`); if (!el) continue;
      d[f.key] = [...el.querySelectorAll('.grow')].map((row, i) => Object.fromEntries(f.fields.map(sf => [sf.key, parseVal(sf, String(fd.get(`g_${f.key}_${i}_${sf.key}`) ?? '').trim())])));
      continue;
    }
    if (f.type === 'link') { if (form.querySelector(`[data-link="${n}"]`)) d[f.key] = fd.getAll(n); continue; }
    if (!form.elements[n]) continue;
    if (f.type === 'checkbox') { d[f.key] = fd.has(n); continue; }
    d[f.key] = parseVal(f, String(fd.get(n) ?? '').trim());
  }
  return d;
}

async function viewForm(t, e, q = new URLSearchParams()) {
  const data = e ? structuredClone(e.data) : Object.fromEntries(t.fields.filter(f => f.type !== 'custom')
    .map(f => [f.key, ['group', 'link'].includes(f.type) ? [] : (q.get(f.key) ?? f.default ?? '')]));
  formFiles = { pending: [], removed: new Set(), existing: e ? await filesFor(e.id) : [] };
  formCtx = { t, e, data, ret: q.get('ret') || '' };
  renderForm({ tags: (e?.tags || []).join(', '), related: e?.related || [] });
  const sec = q.get('sec');
  if (sec) setTimeout(() => document.getElementById('fsec-' + sec)?.scrollIntoView({ behavior: 'smooth' }), 30);
}

function renderForm(extras) {
  const { t, e, data: d } = formCtx;
  const wide = f => ['textarea', 'link', 'progress', 'group', 'custom'].includes(f.type);
  const sectionHTML = sectionsOf(t, d).map(s => {
    let html = '', buf = [];
    const flush = () => { if (buf.length) { html += `<div class="grid2">${buf.join('')}</div>`; buf = []; } };
    for (const f of s.fields) {
      if (f.type === 'hidden') { html += `<input type="hidden" name="f_${f.key}" value="${h(d[f.key])}">`; continue; }
      if (f.type === 'custom') { if (f.form) { flush(); html += `<div class="field">${f.form(d)}</div>`; } continue; }
      const tag = wide(f) ? 'div' : 'label';
      const remind = f.remind ? ` <small>⏰ ${f.remind === 'yearly' ? 'jährliche Erinnerung' : 'Erinnerung'}</small>` : '';
      const block = `<${tag} class="field"><span>${h(lbl(f, d))}${f.unit ? ` <small>(${h(f.unit)})</small>` : ''}${f.required ? ' *' : ''}${remind}</span>${inputFor(f, d[f.key], d)}</${tag}>`;
      if (wide(f)) { flush(); html += block; } else { buf.push(block); if (buf.length === 2) flush(); }
    }
    flush();
    const note = t.sectionNotes?.[s.name]?.(d);
    return `<section class="fsec" id="fsec-${slug(s.name)}">${s.name ? `<h2>${h(s.name)}</h2>` : ''}${note ? `<p class="sec-note">${h(note)}</p>` : ''}${html}</section>`;
  }).join('');
  const tags = allTags().map(x => x[0]);
  const cancel = formCtx.ret || (e ? '#/entry/' + e.id : '#/topic/' + t.id);
  main.innerHTML = `
    <div class="page-head"><div style="display:flex;gap:14px;align-items:center">${topicIcon(t, 'lg')}<div>
      <div class="small muted"><a href="#/topic/${t.id}">${h(t.name)}</a></div>
      <h1>${!e ? (t.single ? h(t.name) + ' ausfüllen' : 'Neuer Eintrag') : h(title(e)) + ' bearbeiten'}</h1></div></div></div>
    <form id="entryform" class="card form" novalidate autocomplete="off">
      ${sectionHTML}
      <section class="fsec" id="fsec-more"><h2>Tags, Verknüpfungen & Dateien</h2>
      <label class="field"><span>Tags <small>mit Komma trennen, z.B. wichtig, 2026, familie</small></span>
        <input type="text" name="tags" value="${h(extras.tags)}" list="taglist" autocomplete="off">
        <datalist id="taglist">${tags.map(x => `<option value="${h(x)}">`).join('')}</datalist></label>
      <div class="field"><span>Verknüpfte Einträge <small>mit beliebigen Einträgen aus anderen Themen verbinden</small></span>
        ${linkBox('related', state.entries.filter(x => x.id !== e?.id), extras.related)}</div>
      <div class="field"><span>Anhänge <small>Fotos, Scans, PDFs</small></span>
        <div id="filelist"></div>
        <div class="actions" style="margin-top:6px">
          <label class="btn sm">📎 Dateien oder Fotos hinzufügen<input type="file" id="fileinput" multiple hidden></label>
          <label class="btn sm">📷 Foto aufnehmen<input type="file" id="camerainput" accept="image/*" capture="environment" hidden></label>
        </div>
        <div class="small muted" style="margin-top:4px">Grosse Fotos werden automatisch verkleinert (max. 2400 px). Das spart Platz und beschleunigt die Synchronisierung.</div></div>
      </section>
      <div class="sticky-actions actions">
        <button class="btn primary" type="button" data-act="save">💾 Speichern</button>
        <a class="btn" href="${h(cancel)}">Abbrechen</a>
      </div>
    </form>`;
  renderFileList();
  $('#entryform').onsubmit = ev => ev.preventDefault();
}

/* Formular neu aufbauen (z.B. nach Land-/Geschlechtswechsel), ohne Eingaben zu verlieren */
function rerenderForm(mutate) {
  const form = $('#entryform');
  formCtx.data = readForm(form, formCtx.t, formCtx.data);
  const extras = { tags: form.elements.tags.value, related: new FormData(form).getAll('related') };
  mutate?.(formCtx.data);
  const y = window.scrollY, focusName = document.activeElement?.name;
  renderForm(extras);
  window.scrollTo(0, y);
  if (focusName) $('#entryform').elements[focusName]?.focus?.({ preventScroll: true });
}

function renderFileList() {
  const el = $('#filelist'); if (!el) return;
  const rows = [
    ...formFiles.existing.map(f => `<div class="file-row ${formFiles.removed.has(f.id) ? 'removed' : ''}">📎 ${h(f.name)} <span class="muted small">${fmtSize(f.size)}</span> <button type="button" class="link-btn" data-act="toggle-file" data-id="${f.id}">${formFiles.removed.has(f.id) ? 'Rückgängig' : 'Entfernen'}</button></div>`),
    ...formFiles.pending.map((f, i) => `<div class="file-row">🆕 ${h(f.name)} <span class="muted small">${fmtSize(f.size)}</span> <button type="button" class="link-btn" data-act="drop-pending" data-i="${i}">Entfernen</button></div>`),
  ];
  el.innerHTML = rows.join('') || '<div class="muted small">Keine Dateien angehängt.</div>';
}

async function saveForm() {
  const form = $('#entryform');
  const { t, e: existing } = formCtx;
  const data = readForm(form, t, formCtx.data);
  for (const f of t.fields) {
    if (f.required && visible(f, data) && !data[f.key]) {
      toast(`Bitte „${lbl(f, data)}" ausfüllen`); form.elements['f_' + f.key]?.focus(); return;
    }
  }
  if (t.id === 'profile') {
    const c = countryOf(data);
    if (data.zip && c.zip && !c.zip.test(data.zip) && !await ask(`Die ${c.zipLabel} „${data.zip}" sieht für ${c.name} ungültig aus (erwartet: ${c.zipHint}). Trotzdem speichern?`)) return;
    data.ids = (data.ids || []).filter(r => r.type || r.number || r.expiry);
  }
  const fd = new FormData(form);
  const tags = [...new Set(String(fd.get('tags') || '').split(/[,#]/).map(s => s.trim().toLowerCase()).filter(Boolean))];
  const now = new Date().toISOString();
  const entry = existing
    ? Object.assign(existing, { data, tags, related: fd.getAll('related') })
    : { id: uid(), topic: t.id, data, tags, related: fd.getAll('related'), created: now, updated: now };

  for (const id of formFiles.removed) await dbDel('files', id);
  await tombstone('file', [...formFiles.removed]);
  for (const f of formFiles.pending) await dbPut('files', { id: uid(), entryId: entry.id, name: f.name, type: f.type || 'application/octet-stream', size: f.size, blob: f, added: now });
  entry.fileCount = formFiles.existing.length - formFiles.removed.size + formFiles.pending.length;

  await saveEntry(entry);
  if (!existing) state.entries.push(entry);
  toast('Gespeichert ✓');
  go(formCtx.ret || '#/entry/' + entry.id);
}

async function deleteEntry(id) {
  const e = byId(id); if (!e) return;
  if (!await ask(`„${title(e)}" löschen? Die Anhänge werden ebenfalls gelöscht.`, 'Ja, löschen')) return;
  const files = await filesFor(id);
  for (const f of files) await dbDel('files', f.id);
  await dbDel('entries', id);
  await tombstone('entry', [id]);
  await tombstone('file', files.map(f => f.id));
  state.entries = state.entries.filter(x => x.id !== id);
  scheduleSync(); scheduleExtras();
  toast('Gelöscht');
  go('#/topic/' + e.topic);
}

const blobToDataURL = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });

async function readImport(file) {

    pendingImport = json;
    $('#importbox').innerHTML = `<div class="notice" style="background:var(--accent-soft);color:var(--text)"><span>Backup vom <b>${new Date(json.exported).toLocaleString(LOCALE)}</b>: ${json.entries.length} Einträge, ${(json.files || []).length} Dateien.</span>

  } catch (err) { toast('Datei konnte nicht gelesen werden: ' + err.message); }
}
async function doImport(replace) {
  const json = pendingImport; if (!json) return;
  if (replace && !await ask('ALLE aktuellen Daten durch dieses Backup ersetzen? Die aktuellen Einträge und Dateien werden entfernt.', 'Ja, ersetzen')) return;
  if (replace) {
    await dbClear('entries');
    await dbClear('files');
    state.entries = [];
  }
  const touched = new Set();
  for (const e of json.entries) {
    const cur = byId(e.id);
    if (cur && cur.updated >= e.updated) continue;
    migrate(e);
    await dbPut('entries', e);
    if (cur) Object.assign(cur, e, { _hay: null }); else state.entries.push(e);
    touched.add(e.id);
    if (cur) for (const f of await filesFor(e.id)) await dbDel('files', f.id);
  }
  for (const f of json.files || []) {
    if (!touched.has(f.entryId)) continue;
    const { data, ...rest } = f;
    await dbPut('files', { ...rest, blob: dataURLToBlob(data) });
  }
  for (const [k, v] of Object.entries(json.meta || {})) if (!k.startsWith('_') && (replace || state.meta[k] === undefined)) await setMeta(k, v);
  pendingImport = null;
  scheduleSync(); scheduleExtras();
  toast(`${touched.size} Einträge importiert ✓`);
  go('#/');
}

const CLIENT_ID = 'c42b89ee-93a0-44f5-9669-f0eea6641ef3'; // Anwendungs-ID (Client) der App-Registrierung "Lifebook"

const b64url = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const toB64 = bytes => { let s = ''; const u = new Uint8Array(bytes); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(s); };

async function signIn(prompt) {

  const st = b64url(crypto.getRandomValues(new Uint8Array(16)));
  localStorage.setItem('lb_pkce', JSON.stringify({ verifier, state: st, route: currentRoute, silent: prompt === 'none' }));
  const p = new URLSearchParams({ client_id: clientId(), response_type: 'code', redirect_uri: redirectUri(), scope: SCOPES, code_challenge: challenge, code_challenge_method: 'S256', state: st, response_mode: 'query' });

async function gErr(r) { let m = r.status + ''; try { const j = await r.json(); m = j.error?.message || m; } catch { } return new Error('Microsoft: ' + m); }
async function disconnectMicrosoft() {
  if (!await ask('Dieses Gerät vom Microsoft-Konto trennen? Deine Lifebook-Daten bleiben auf diesem Gerät.', 'Trennen')) return;

/* =====================================================================
   VERSCHLÜSSELUNG: AES-256-GCM, Schlüssel aus dem Sync-Passwort (PBKDF2).
   Hochgeladen werden nur verschlüsselte Daten; das Passwort verlässt das Gerät nie.
   ===================================================================== */
const TE = new TextEncoder(), TD = new TextDecoder();
async function deriveKey(password, salt, iterations = 310000) {
  const base = await crypto.subtle.importKey('raw', TE.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptBytes(key, bytes) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, bytes));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
  return out;
}
async function decryptBytes(key, buf) {
  const u = new Uint8Array(buf);
  return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, key, u.slice(12)));
}

/* =====================================================================
   ONEDRIVE: Dateien liegen im privaten App-Ordner "Apps/<App-Name>"
   ===================================================================== */
const SYNC_FILE = 'lifebook-data.bin', KEY_FILE = 'lifebook-key.json';
const oneDrive = {
  async getItem(path) {
    const r = await graph(`/me/drive/special/approot:/${path}?select=id,eTag,size,@microsoft.graph.downloadUrl`);
    if (r.status === 404) return null;
    if (!r.ok) throw await gErr(r);
    return r.json();
  },
  async download(item) {
    const r = await fetch(item['@microsoft.graph.downloadUrl']);
    if (!r.ok) throw new Error('Download von OneDrive fehlgeschlagen (' + r.status + ')');
    return r.arrayBuffer();
  },
  async upload(path, bytes, etag) {
    if (bytes.byteLength <= 4000000) {
      const r = await graph(`/me/drive/special/approot:/${path}:/content`, { method: 'PUT', body: bytes, headers: { 'Content-Type': 'application/octet-stream', ...(etag ? { 'If-Match': etag } : {}) } });
      if (r.status === 412) throw new Conflict();
      if (!r.ok) throw await gErr(r);
      return r.json();
    }
    // grosse Dateien: fortsetzbarer Upload in 5-MB-Stücken
    const s = await graph(`/me/drive/special/approot:/${path}:/createUploadSession`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ item: { '@microsoft.graph.conflictBehavior': 'replace' } }) });
    if (!s.ok) throw await gErr(s);
    const { uploadUrl } = await s.json();
    const CH = 5 * 1024 * 1024; let res;
    for (let i = 0; i < bytes.byteLength; i += CH) {
      const part = bytes.slice(i, i + CH);
      res = await fetch(uploadUrl, { method: 'PUT', headers: { 'Content-Range': `bytes ${i}-${i + part.byteLength - 1}/${bytes.byteLength}` }, body: part });
      if (!res.ok) throw new Error('Upload zu OneDrive fehlgeschlagen (' + res.status + ')');
    }
    return res.json();
  },
  async remove(path) {
    const r = await graph(`/me/drive/special/approot:/${path}`, { method: 'DELETE' });
    if (!r.ok && r.status !== 404) throw await gErr(r);
  },
};
const driveImpl = () => window.__testDrive || oneDrive; // für lokale Tests austauschbar
const msConnected = () => !!(window.__testDrive || state.meta._account);
const syncConfigured = () => msConnected() && !!state.meta._syncKey;

async function setSyncPassword() {
  const pw1 = $('#pw1')?.value || '', pw2 = $('#pw2');
  const creating = !!pw2;
  if (creating && pw1.length < 10) return toast('Bitte mindestens 10 Zeichen verwenden');
  if (creating && pw1 !== pw2.value) return toast('Die Passwörter stimmen nicht überein');
  if (!pw1) return toast('Gib dein Sync-Passwort ein');
  const btn = $('[data-act=key-set]'); if (btn) { btn.disabled = true; btn.textContent = 'Bitte warten…'; }
  try {
    const d = driveImpl();
    const item = await d.getItem(KEY_FILE);
    let key;
    if (item) {
      const kf = JSON.parse(TD.decode(await d.download(item)));
      key = await deriveKey(pw1, fromB64(kf.salt), kf.iterations);
      try { if (TD.decode(await decryptBytes(key, fromB64(kf.check))) !== 'lifebook-ok') throw 0; }
      catch { throw new Error('Falsches Sync-Passwort'); }
    } else {
      const salt = crypto.getRandomValues(new Uint8Array(16)), iterations = 310000;
      key = await deriveKey(pw1, salt, iterations);
      const check = await encryptBytes(key, TE.encode('lifebook-ok'));
      await d.upload(KEY_FILE, TE.encode(JSON.stringify({ v: 1, salt: toB64(salt), iterations, check: toB64(check) })));
    }
    await setMeta('_syncKey', key);
    toast('Sync-Passwort auf diesem Gerät gespeichert ✓');
    await syncNow();
  } catch (e) { toast(e.message); }
  viewSync();
}

/* =====================================================================
   SYNCHRONISIERUNG: pro Eintrag gewinnt die neuere Änderung;
   Löschungen werden gemerkt und übertragen
   ===================================================================== */
let syncState = { s: 'off', msg: '' }, syncTimer = null, syncRunning = null;
function setSync(s, msg = '') { syncState = { s, msg }; renderSyncChip(); }
function syncLabel() {
  if (!msConnected()) return null;
  if (!state.meta._syncKey) return ['🔑', 'Sync-Passwort fehlt'];
  switch (syncState.s) {
    case 'syncing': return ['⏳', 'Synchronisiere…'];
    case 'error': return ['⚠️', 'Sync-Problem'];
    case 'login': return ['🔑', 'Neu verbinden'];
    default: return ['☁️', state.meta._lastSync ? 'Synchronisiert ' + timeAgo(state.meta._lastSync) : 'Noch nicht synchronisiert'];
  }
}
function renderSyncChip() {
  const el = $('#syncchip'); if (!el) return;
  const l = syncLabel();
  el.hidden = !l;
  if (l) { el.innerHTML = `${l[0]} <span>${h(l[1])}</span>`; el.title = syncState.msg || l[1]; }
}
function scheduleSync(delay = 2500) {
  if (!syncConfigured()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncNow(), delay);
}
async function syncNow() {
  if (!syncConfigured()) return;
  if (syncRunning) return syncRunning;
  syncRunning = (async () => {
    setSync('syncing');
    try {
      for (let attempt = 0; ; attempt++) {
        try { await syncOnce(); break; }
        catch (e) { if (!(e instanceof Conflict) || attempt >= 2) throw e; }
      }
      await setMeta('_lastSync', new Date().toISOString());
      setSync('idle');
    } catch (e) {
      console.error(e);
      if (e instanceof NeedLogin) setSync('login', e.message);
      else setSync('error', e.message || String(e));
    } finally { syncRunning = null; }
  })();
  return syncRunning;
}
const newer = (a, b) => (!b || (a && a > b)) ? a : b;
async function syncOnce() {
  const key = state.meta._syncKey, d = driveImpl(), now = new Date().toISOString();
  const item = await d.getItem(SYNC_FILE);
  let remote = { entries: [], deleted: {}, deletedFiles: {}, files: [], settings: null };
  if (item) remote = { ...remote, ...JSON.parse(TD.decode(await decryptBytes(key, await d.download(item)))) };
  const remoteJSON = item ? JSON.stringify({ ...remote, savedAt: undefined }) : '';

  // 1. Löschungen und Einträge zusammenführen
  const del = { ...remote.deleted }, delF = { ...remote.deletedFiles };
  for (const [id, t] of Object.entries(state.meta.deleted || {})) del[id] = newer(t, del[id]);
  for (const [id, t] of Object.entries(state.meta.deletedFiles || {})) delF[id] = newer(t, delF[id]);
  const merged = new Map(remote.entries.map(e => [e.id, e]));
  for (const e of state.entries) { const r = merged.get(e.id); if (!r || r.updated < e.updated) merged.set(e.id, clean(e)); }
  for (const [id, t] of Object.entries(del)) { const e = merged.get(id); if (e && e.updated <= t) merged.delete(id); }

  // 2. auf dieses Gerät übernehmen
  let changed = false;
  for (const e of merged.values()) {
    const loc = byId(e.id);
    if (!loc) { const copy = structuredClone(e); state.entries.push(copy); await dbPut('entries', copy); changed = true; }
    else if (loc.updated < e.updated) { Object.assign(loc, structuredClone(e), { _hay: null }); await dbPut('entries', clean(loc)); changed = true; }
  }
  for (const e of [...state.entries]) if (!merged.has(e.id)) {
    state.entries = state.entries.filter(x => x !== e);
    await dbDel('entries', e.id);
    for (const f of await filesFor(e.id)) await dbDel('files', f.id);
    changed = true;
  }

  // 3. Anhänge: jede Datei ist ein eigener verschlüsselter Blob in "files/"
  const localFiles = await dbAll('files');
  const localIds = new Set(localFiles.map(f => f.id));
  const idx = new Map((remote.files || []).map(f => [f.id, f]));
  for (const f of [...idx.values()]) if (!merged.has(f.entryId) && !delF[f.id]) delF[f.id] = now;
  for (const id of Object.keys(delF)) {
    if (localIds.has(id)) { await dbDel('files', id); localIds.delete(id); changed = true; }
    if (idx.has(id)) { idx.delete(id); try { await d.remove(`files/${id}.bin`); } catch { } }
  }
  for (const f of idx.values()) {
    if (localIds.has(f.id) || !merged.has(f.entryId)) continue;
    const it = await d.getItem(`files/${f.id}.bin`);
    if (!it) continue;
    const bytes = await decryptBytes(key, await d.download(it));
    await dbPut('files', { ...f, blob: new Blob([bytes], { type: f.type }) });
    changed = true;
  }
  for (const f of localFiles) {
    if (idx.has(f.id) || delF[f.id] || !merged.has(f.entryId)) continue;
    const enc = await encryptBytes(key, new Uint8Array(await f.blob.arrayBuffer()));
    await d.upload(`files/${f.id}.bin`, enc);
    const { blob, ...info } = f; idx.set(f.id, info);
  }

  // 4. Einstellungen (Name, Währung, Themen-Pläne): die neuere gewinnt
  const localSettings = { updated: state.meta.settingsUpdated || '', ...Object.fromEntries(SYNCED_META.map(k => [k, state.meta[k]])) };
  let settings = localSettings;
  if (remote.settings && remote.settings.updated > localSettings.updated) {
    settings = remote.settings;
    for (const k of SYNCED_META) { state.meta[k] = settings[k]; await dbPut('meta', { key: k, value: settings[k] }); }
    state.meta.settingsUpdated = settings.updated; await dbPut('meta', { key: 'settingsUpdated', value: settings.updated });
    changed = true;
  }

  // 5. zusammengeführte Löschungen lokal merken, Anhang-Zähler aktualisieren
  state.meta.deleted = del; await dbPut('meta', { key: 'deleted', value: del });
  state.meta.deletedFiles = delF; await dbPut('meta', { key: 'deletedFiles', value: delF });
  if (changed) {
    const counts = {}; for (const f of await dbAll('files')) counts[f.entryId] = (counts[f.entryId] || 0) + 1;
    for (const e of state.entries) e.fileCount = counts[e.id] || 0;
  }

  // 6. zusammengeführten Stand hochladen, falls er sich von OneDrive unterscheidet
  const payload = { v: 1, entries: [...merged.values()], deleted: del, deletedFiles: delF, files: [...idx.values()], settings };
  if (JSON.stringify({ ...payload, savedAt: undefined }) !== remoteJSON) {
    await d.upload(SYNC_FILE, await encryptBytes(key, TE.encode(JSON.stringify({ ...payload, savedAt: now }))), item?.eTag);
  }
  // mit neuen Daten neu anzeigen, aber nie während ein Formular offen ist
  if (changed) scheduleExtras(1500);
  if (changed && !/^#\/(edit|new)\//.test(currentRoute)) route();
}

/* =====================================================================
   ABSENDER-ÜBERSICHT: wer schreibt dir, und warum?
   Gruppiert das Postfach nach Absender, erkennt die Art (Vertrag, Kauf,
   Termin, Werbung, persönlich) und bietet die offizielle Abmeldung
   (List-Unsubscribe) für Werbung an. Analyse-Daten bleiben auf dem Gerät.

const SENDER_CATS = {
  contract: { l: 'Vertrag / Abo', i: '📄' },
  purchase: { l: 'Kauf / Bestellung', i: '🛒' },
  appointment: { l: 'Termin / Buchung', i: '📅' },
  marketing: { l: 'Werbung / Newsletter', i: '📣' },
  personal: { l: 'Persönlich', i: '👤' },
  other: { l: 'Unklar', i: '❔' },
};
const SENDER_KW = {
  contract: /rechnung|invoice|faktur|police|polizz|vertrag|contrat|contratto|prämie|praemie|kündigung|kuendigung|\babo\b|abonnement|subscription|mitgliedschaft|membership|kontoauszug|account statement|mahnung|zahlungserinnerung|lastschrift|ebill|e-rechnung|versicherung|leistungsabrechnung|steuer|tarif|preisanpassung|your plan|billing|jahresbeitrag/i,
  purchase: /bestellung|bestellbestätigung|\border\b|commande|ordine|versand|versendet|shipped|lieferung|delivery|livraison|paket|sendung|tracking|quittung|kaufbeleg|receipt|zahlungsbestätigung|payment confirmation|ihr kauf|your purchase|rückerstattung|refund/i,
  appointment: /termin|appointment|rendez-vous|appuntamento|reservation|reservierung|buchung|booking|check-?in|boarding|\bflug|flight|ticket|einladung|invitation|erinnerung an|konsultation/i,
  marketing: /newsletter|angebot|aktion|rabatt|\bsale\b|\bdeal|gutschein|coupon|\d+\s?%|black friday|cyber monday|nur heute|exklusiv|entdecke|discover|neuheiten|jetzt shoppen|shop now|gratis|free shipping|gewinnspiel|webinar|online ansehen|view in browser/i,
};
const SENDER_ADDR = { marketing: /^(news|newsletter|marketing|promo|angebote|offers|mailing|hello|deals)\b/i, contract: /^(billing|rechnung|invoice|factur|kundendienst|kundenservice|accounts?)\b/i };
const FREEMAIL = /^(gmail|googlemail|hotmail|outlook|live|msn|yahoo|ymail|icloud|me|mac|gmx|web|bluewin|sunrise|hispeed|protonmail|proton|t-online|aol)\./i;
const domainOf = a => (String(a).split('@')[1] || '').toLowerCase();
const baseDomain = d => d.split('.').slice(-2).join('.');
const normName = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');

function senderLinks(s) {
  const base = baseDomain(domainOf(s.addr)), brand = normName(base.split('.')[0]);
  const contact = entriesOf('contacts').find(e => (e.data.email || '').trim().toLowerCase() === s.addr);
  const contract = entriesOf('contracts').find(e => {
    const w = String(e.data.website || '').toLowerCase().replace(/^https?:\/\//, '').split('/')[0];
    if (w && baseDomain(w) === base) return true;
    const p = normName(e.data.provider);
    return p.length >= 3 && brand.length >= 3 && (brand.includes(p) || p.includes(brand));
  });
  return { contact, contract };
}
function classifySender(s, links) {
  const sc = { contract: 0, purchase: 0, appointment: 0, marketing: 0, personal: 0 };
  for (const t of [...(s.subjects || []), ...(s.previews || [])])
    for (const k of ['contract', 'purchase', 'appointment', 'marketing']) if (SENDER_KW[k].test(t)) sc[k] += k === 'marketing' ? 1 : 2;
  const local = s.addr.split('@')[0];
  if (SENDER_ADDR.marketing.test(local)) sc.marketing += 1;
  if (SENDER_ADDR.contract.test(local)) sc.contract += 2;
  if (s.unsub && (s.unsub.http || s.unsub.mailto)) sc.marketing += 3;
  if (links.contract) sc.contract += 6;
  if (links.contact) sc.personal += 8;
  if (FREEMAIL.test(domainOf(s.addr)) && !(s.unsub && (s.unsub.http || s.unsub.mailto))) sc.personal += 3;
  const [cat, score] = Object.entries(sc).sort((a, b) => b[1] - a[1])[0];
  return score >= 2 ? cat : 'other';
}

let senderScan = null; // läuft gerade eine Analyse?
function senderProgress(text) { const el = $('#sndprog'); if (el) el.textContent = text; }
async function scanSenders(full) {
  if (senderScan) return senderScan;
  senderScan = (async () => {
    try {
      const old = !full && state.meta._mailSenders;
      const data = old ? structuredClone(old) : { senders: {}, scannedUntil: null, months: 12 };
      const since = data.scannedUntil || new Date(Date.now() - 365 * 86400000).toISOString();
      const me = (state.meta._account?.email || '').toLowerCase();
      let junkId = '';
      try { const jr = await graph('/me/mailFolders/junkemail?$select=id'); if (jr.ok) junkId = (await jr.json()).id; } catch (e) { if (e instanceof NeedLogin) throw e; }
      let url = `/me/messages?$select=id,from,subject,receivedDateTime,bodyPreview,isDraft,parentFolderId&$filter=receivedDateTime%20${data.scannedUntil ? 'gt' : 'ge'}%20${since}&$orderby=receivedDateTime%20desc&$top=250`;
      let n = 0, newest = data.scannedUntil;
      while (url && n < 5000) {
        const r = await graph(url); if (!r.ok) throw await gErr(r);
        const j = await r.json();
        for (const m of j.value || []) {
          const addr = (m.from?.emailAddress?.address || '').toLowerCase();
          if (!addr || m.isDraft || addr === me) continue;
          const s = data.senders[addr] ||= { addr, name: '', count: 0, last: '', lastId: '', subjects: [], previews: [], junk: false };
          s.count++;
          if (!s.last || m.receivedDateTime > s.last) { s.last = m.receivedDateTime; s.lastId = m.id; s.name = m.from.emailAddress.name || s.name; s.junk = !!junkId && m.parentFolderId === junkId; }
          if (m.subject && s.subjects.length < 5 && !s.subjects.includes(m.subject)) s.subjects.push(m.subject);
          if (m.bodyPreview && s.previews.length < 2) s.previews.push(m.bodyPreview.slice(0, 160));
          if (!newest || m.receivedDateTime > newest) newest = m.receivedDateTime;
        }
        n += (j.value || []).length;
        senderProgress(`${n} E-Mails analysiert, ${Object.keys(data.senders).length} Absender…`);
        url = j['@odata.nextLink'] || null;
      }
      // Abmelde-Informationen der häufigsten Absender nachladen (aus der neusten E-Mail)
      const todo = Object.values(data.senders).filter(s => s.unsub === undefined && !s.junk).sort((a, b) => b.count - a.count).slice(0, 150);
      let done = 0;
      const worker = async () => { while (todo.length) { const s = todo.shift(); s.unsub = await fetchUnsub(s) || {}; done++; senderProgress(`Abmelde-Links prüfen… ${done}`); } };
      await Promise.all([worker(), worker(), worker(), worker()]);
      data.scannedUntil = newest || since;
      data.scannedAt = new Date().toISOString();
      await setMeta('_mailSenders', data);
      toast(`Analyse fertig: ${Object.keys(data.senders).length} Absender ✓`);
    } catch (e) {
      if (e instanceof NeedLogin) { setSync('login'); toast('Bitte unter „Handy & Sync" neu verbinden'); }
      else toast('Analyse fehlgeschlagen: ' + e.message);
    } finally {
      senderScan = null;
      if (currentRoute.startsWith('#/senders')) route();
    }
  })();
  return senderScan;
}
async function fetchUnsub(s) {
  try {
    const r = await graph(`/me/messages/${encodeURIComponent(s.lastId)}?$select=internetMessageHeaders`);
    if (!r.ok) return null;
    const hs = (await r.json()).internetMessageHeaders || [];
    const get = n => hs.find(x => String(x.name).toLowerCase() === n)?.value || '';
    const links = [...get('list-unsubscribe').matchAll(/<([^>]+)>/g)].map(m => m[1].trim());
    const http = links.find(l => /^https:\/\//i.test(l)) || '';

  } catch (e) { if (e instanceof NeedLogin) throw e; return null; }
}
