function plainValue(f, v, d) {
  if (v === '' || v == null || v === false || (Array.isArray(v) && !v.length)) return '';
  switch (f.type) {
    case 'date': return noYear(v) ? fmtDate(v) : `${fmtDate(v)} (${v})`;
    case 'money': return fmtMoney(v);
    case 'number': return v + (f.unit ? ' ' + f.unit : '');
    case 'checkbox': return 'Ja';
    case 'country': return COUNTRIES[v]?.name || v;
    case 'select': { const o = (optionsOf(f, d) || []).find(o => optVal(o) === v); return o ? optLabel(o) : L(v); }
    case 'rating': return v + '/5';
    case 'progress': return v + '%';
    case 'link': return v.map(byId).filter(Boolean).map(title).join(', ');
    case 'group': return v.map(r => f.fields.map(sf => { const x = plainValue(sf, r[sf.key], d); return x ? `${sf.label}: ${x}` : ''; }).filter(Boolean).join(', ')).filter(Boolean).join(' | ');
    default: return String(v);
  }
}
function entryFields(e) {
  const t = TOPIC[e.topic];
  return t.fields.filter(f => !['custom', 'hidden'].includes(f.type) && visible(f, e.data))
    .map(f => ({ label: lbl(f, e.data), value: plainValue(f, e.data[f.key], e.data) })).filter(x => x.value);
}
function entryMarkdown(e, files) {
  const t = TOPIC[e.topic];
  const lines = [`# ${title(e)}`, '', `*${t.name}* · zuletzt geändert ${new Date(e.updated).toLocaleString(LOCALE)}`, '',
    '> Diese Datei schreibt Lifebook automatisch. Änderungen bitte in Lifebook machen. Neue Dateien kannst du einfach in diesen Ordner legen: Lifebook übernimmt sie als Anhang.', ''];
  for (const { label, value } of entryFields(e)) lines.push(`- **${label}:** ${value.replace(/\n/g, '\n  ')}`);
  if ((e.tags || []).length) lines.push('', '**Tags:** ' + e.tags.map(x => '#' + x).join(' '));
  const rel = (e.related || []).map(byId).filter(Boolean);
  if (rel.length) lines.push('', '**Verknüpft mit:** ' + rel.map(x => `${title(x)} (${TOPIC[x.topic].name})`).join(', '));
  if (files.length) lines.push('', '## Anhänge', ...files.map(f => `- ${f.name} (${fmtSize(f.size)})`));
  return lines.join('\n') + '\n';
}

async function fileExists(dir, name) { try { await dir.getFileHandle(name); return true; } catch { return false; } }
async function writeDiskFile(dir, name, data) {
  const fh = await dir.getFileHandle(name, { create: true });
  const w = await fh.createWritable(); await w.write(data); await w.close();
}
function uniqueName(name, taken) {
  if (!taken.includes(name)) return name;
  const m = name.match(/^(.*?)(\.[^.]+)?$/); let i = 2;
  while (taken.includes(`${m[1]} (${i})${m[2] || ''}`)) i++;
  return `${m[1]} (${i})${m[2] || ''}`;
}
async function mirrorNow() {
  const root = state.meta._dirHandle;
  if (!root) return;
  dirState.perm = await dirPermission(); renderDirChip();
  if (dirState.perm !== 'granted') return;
  if (dirState.running) { dirState.again = true; return; }
  dirState.running = true; dirState.error = '';
  let picked = 0; const pickedFor = new Set();
  try {
    await readJarvisInbox(root);
    const man = structuredClone(state.meta._mirror || { entries: {} });
    const off = state.meta._mirrorOff || {};
    const seen = new Set();
    for (const t of TOPICS.filter(t => !off[t.id])) {
      const list = entriesOf(t.id);
      if (!list.length) continue;
      const tdir = await root.getDirectoryHandle(safeName(t.name), { create: true });
      for (const e of list) {
        seen.add(e.id);
        // der Ordnername bleibt stabil, auch wenn der Titel später ändert
        const m = man.entries[e.id] || { folder: `${safeName(title(e))} (${e.id.slice(-4)})`, topic: t.id, files: {}, written: '' };
        const edir = await tdir.getDirectoryHandle(m.folder, { create: true });
        // 1. neue Dateien übernehmen, die du selbst in den Ordner gelegt hast
        const known = Object.values(m.files);
        for await (const [name, h] of edir.entries()) {
          if (h.kind !== 'file' || name === 'Eintrag.md' || known.includes(name) || /^(~\$|\.)|\.(tmp|crdownload|part)$/i.test(name)) continue;
          const file = await h.getFile();
          if (file.size > 25 * 1048576) continue;
          const id = uid();
          await dbPut('files', { id, entryId: e.id, name, type: file.type || guessType(name), size: file.size, blob: file, added: new Date().toISOString() });
          m.files[id] = name; picked++; pickedFor.add(e);
          e.fileCount = (e.fileCount || 0) + 1;
        }
        // 2. Anhänge aus Lifebook auf den PC schreiben (auch wieder, falls dort gelöscht)
        const efiles = await filesFor(e.id);
        for (const f of efiles) {
          if (m.files[f.id] && await fileExists(edir, m.files[f.id])) continue;
          const name = m.files[f.id] || uniqueName(safeName(f.name), Object.values(m.files));
          await writeDiskFile(edir, name, f.blob); m.files[f.id] = name;
        }
        // 3. Anhänge, die in Lifebook gelöscht wurden, auch auf dem PC entfernen
        for (const [fid, name] of Object.entries(m.files)) {
          if (efiles.some(f => f.id === fid)) continue;
          try { await edir.removeEntry(name); } catch { }
          delete m.files[fid];
        }
        // 4. Eintrag.md nur bei Änderungen neu schreiben
        const stamp = e.updated + '|' + Object.values(m.files).sort().join('/');
        if (m.written !== stamp || !(await fileExists(edir, 'Eintrag.md'))) { await writeDiskFile(edir, 'Eintrag.md', entryMarkdown(e, efiles)); m.written = stamp; }
        man.entries[e.id] = m;
      }
    }
    // gelöschte Einträge (oder abgeschaltete Themen): Ordner entfernen
    for (const [id, m] of Object.entries(man.entries)) {
      if (seen.has(id)) continue;
      try { const tdir = await root.getDirectoryHandle(safeName(TOPIC[m.topic]?.name), { create: false }); await tdir.removeEntry(m.folder, { recursive: true }); } catch { }
      delete man.entries[id];
    }
    man.last = new Date().toISOString();
    await setMeta('_mirror', man);
    if (picked) {
      toast(`${picked} ${picked === 1 ? 'Datei' : 'Dateien'} aus dem PC-Ordner übernommen ✓`);
      // geänderte Einträge speichern (synchronisiert die neuen Anhänge auch aufs iPhone);
      // den Zeitstempel im Manifest nachführen, damit Eintrag.md nicht unnötig neu geschrieben wird
      for (const e of pickedFor) {
        await saveEntry(e);
        const m = man.entries[e.id]; if (m) m.written = e.updated + '|' + Object.values(m.files).sort().join('/');
      }
      await setMeta('_mirror', man);
    }
  } catch (e) {
    console.error(e); dirState.error = e.message || String(e);
  } finally {
    dirState.running = false;
    if (dirState.again) { dirState.again = false; setTimeout(mirrorNow, 500); }
    if (currentRoute === '#/jarvis') viewJarvis();
  }
}

async function jarvisPush(force = false) {

  jarvisRunning = (async () => {
    jarvisState = { s: 'pushing', msg: '' };

      const topics = TOPICS.filter(t => !cfg.off?.[t.id]);
      const entries = state.entries.filter(e => topics.some(t => t.id === e.topic));
      const ids = new Set(entries.map(e => e.id));

        v: 1, owner: state.meta._account?.name || '', topics: topics.map(t => ({ id: t.id, name: t.name })),
        entries: entries.map(e => ({
          id: e.id, topic: e.topic, topicName: TOPIC[e.topic].name, title: title(e), updated: e.updated,

      };

          await jarvisFetch('/lifebook/file/' + f.id, { method: 'PUT', headers: { 'Content-Type': f.type || 'application/octet-stream', 'X-File-Name': encodeURIComponent(f.name), 'X-Entry-Id': f.entryId }, body: f.blob });

   Claude legt Änderungsvorschläge als .json-Datei in den Ordner
   "_Jarvis-Vorschläge" im PC-Ordner. Lifebook zeigt sie mit "bisher → neu"
   an; gespeichert wird erst, wenn du auf "Übernehmen" klickst.
   Format: { "action": "update", "entryId": "…", "data": { feld: wert },
             "addTags": [], "removeTags": [], "reason": "…" }
        oder { "action": "create", "topic": "contracts", "data": {…}, … }

const INBOX_DIR = '_Jarvis-Vorschläge';
function validSuggestion(x) {
  if (!x || typeof x !== 'object') return null;
  const action = x.action === 'create' ? 'create' : 'update';
  const topic = action === 'create' ? x.topic : byId(x.entryId)?.topic;
  const t = TOPIC[topic];
  if (!t) return null;
  const data = {};
  for (const [k, v] of Object.entries(x.data || {})) {
    const f = t.fields.find(f => f.key === k && !['custom', 'hidden'].includes(f.type));
    if (!f) continue; // unbekannte Felder werden ignoriert
    if (['number', 'money', 'rating', 'progress'].includes(f.type)) { if (v === '' || Number.isFinite(Number(v))) data[k] = v === '' ? '' : Number(v); }
    else if (f.type === 'link') { if (Array.isArray(v)) data[k] = v.filter(id => byId(id)).slice(0, 50); }
    else if (f.type === 'group') { if (Array.isArray(v)) data[k] = v.filter(r => r && typeof r === 'object').slice(0, 50); }
    else if (f.type === 'checkbox') data[k] = !!v;
    else data[k] = String(v ?? '').slice(0, 20000);
  }
  const tagList = a => Array.isArray(a) ? a.map(s => String(s).toLowerCase().trim()).filter(Boolean).slice(0, 20) : [];
  return {
    id: uid(), action, entryId: action === 'update' ? x.entryId : null, topic, data,
    addTags: tagList(x.addTags), removeTags: tagList(x.removeTags), reason: String(x.reason || '').slice(0, 2000), received: new Date().toISOString(),
  };
}

/* =====================================================================
   KONTAKTE: .vcf-Datei aus der iPhone-App „Kontakte" importieren
   ===================================================================== */
function parseVCF(text) {
  const lines = text.replace(/\r?\n[ \t]/g, '').split(/\r?\n/);
  const cards = []; let c = null;
  const unesc = s => s.replace(/\\n/gi, '\n').replace(/\\([,;\\])/g, '$1').trim();
  const qp = s => { try { return decodeURIComponent(s.replace(/=\r?\n/g, '').replace(/=([0-9A-F]{2})/gi, '%$1')); } catch { return s; } };
  for (const line of lines) {
    if (/^BEGIN:VCARD/i.test(line)) { c = { tel: [], email: [] }; continue; }
    if (/^END:VCARD/i.test(line)) { if (c) cards.push(c); c = null; continue; }
    if (!c) continue;
    const i = line.indexOf(':'); if (i < 0) continue;
    const [nameRaw, ...params] = line.slice(0, i).split(';');
    const name = nameRaw.replace(/^item\d+\./i, '').toUpperCase(), p = params.join(';').toUpperCase();
    let v = line.slice(i + 1); if (p.includes('QUOTED-PRINTABLE')) v = qp(v);
    if (name === 'FN') c.fn = unesc(v);
    else if (name === 'N') { const [last, first] = v.split(';'); c.n = [unesc(first || ''), unesc(last || '')].filter(Boolean).join(' '); }
    else if (name === 'TEL') c.tel.push({ v: unesc(v), cell: /CELL|MOBILE|IPHONE/.test(p) });
    else if (name === 'EMAIL') c.email.push(unesc(v));
    else if (name === 'ORG') c.org = unesc(v.split(';')[0]);
    else if (name === 'NOTE') c.note = unesc(v);
    else if (name === 'BDAY') { const m = v.replace(/T.*$/, '').match(/^(\d{4}|--)-?(\d{2})-?(\d{2})$/); if (m) c.bday = `${m[1] === '--' ? '1604' : m[1]}-${m[2]}-${m[3]}`; }
    else if (name === 'ADR' && !c.adr) { const a = v.split(';').map(unesc); c.adr = [a[2], [a[5], a[3]].filter(Boolean).join(' '), a[6]].filter(Boolean).join('\n'); }
  }
  return cards;
}
async function importVCF(file) {
  try {
    const cards = parseVCF(await file.text());
    if (!cards.length) return toast('In dieser Datei wurden keine Kontakte gefunden');
    let added = 0, updated = 0;
    const now = new Date().toISOString();
    for (const c of cards) {
      const name = c.fn || c.n; if (!name) continue;
      const phone = (c.tel.find(t => t.cell) || c.tel[0])?.v || '';
      const extra = [...c.tel.filter(t => t.v !== phone).map(t => 'Telefon: ' + t.v), ...c.email.slice(1).map(x => 'E-Mail: ' + x)].join('\n');
      const data = { name, relation: '', company: c.org || '', phone, email: c.email[0] || '', address: c.adr || '', birthday: c.bday || '', notes: [c.note, extra].filter(Boolean).join('\n') };
      const existing = entriesOf('contacts').find(e => (e.data.name || '').toLowerCase() === name.toLowerCase());
      if (existing) {
        let ch = false;
        for (const [k, v] of Object.entries(data)) if (v && !existing.data[k]) { existing.data[k] = v; ch = true; }
        if (ch) { await saveEntry(existing); updated++; }
      } else {
        const e = { id: uid(), topic: 'contacts', data, tags: [], related: [], created: now, updated: now };
        state.entries.push(e); await saveEntry(e); added++;
      }
    }
    toast(`${added} Kontakte hinzugefügt, ${updated} ergänzt ✓`);
    route();
  } catch (e) { toast('Die Datei konnte nicht gelesen werden: ' + e.message); }
}

/* =====================================================================
   FOTOS: grosse Bilder vor dem Speichern verkleinern
   ===================================================================== */
async function shrinkImage(file) {
  if (!/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type) || file.size < 1500000) return file;
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch { return file; }
}
async function addPendingFiles(input) {
  const files = [...input.files]; input.value = '';
  const big = files.filter(f => f.size > 25 * 1048576 && !f.type.startsWith('image/'));
  if (big.length) toast('Dateien über 25 MB wurden übersprungen');
  for (const f of files) {
    if (big.includes(f)) continue;
    const s = await shrinkImage(f);
    if (s.size <= 25 * 1048576) formFiles.pending.push(s);
  }
  renderFileList();
}

/* Symbol für den iPhone-Home-Bildschirm */
(function touchIcon() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 180, 180); g.addColorStop(0, '#5a86ff'); g.addColorStop(1, '#2f55d4');
    x.fillStyle = g; x.fillRect(0, 0, 180, 180);
    x.font = '108px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('📘', 90, 98);
    $('#touchicon').href = c.toDataURL('image/png');
  } catch { }
})();

/* Daten aus der ersten Version von „Über mich" umwandeln */
function migrate(e) {
  if (e.topic !== 'profile') return false;
  const d = e.data; let changed = false;
  if (d.fullName && !d.firstName) {
    const parts = d.fullName.trim().split(/\s+/);
    d.firstName = parts.shift(); d.lastName = parts.join(' ');
    delete d.fullName; changed = true;
  }
  const old = [['passportExpiry', 'Passport'], ['idCardExpiry', 'Identity card'], ['licenseExpiry', 'Driving licence']].filter(([k]) => d[k]);
  if (old.length) {
    d.ids = [...(d.ids || []), ...old.map(([k, type]) => ({ type, number: '', expiry: d[k] }))];
    old.forEach(([k]) => delete d[k]); changed = true;
  }
  if (d.address && !d.street) { d.notes = [d.notes, 'Alte Adresse: ' + d.address].filter(Boolean).join('\n'); delete d.address; changed = true; }
  if (d.clothingSize && !d.sizeTops) { d.sizeTops = d.clothingSize; delete d.clothingSize; changed = true; }
  if (d.shoeSize && !d.sizeShoes) { d.sizeShoes = d.shoeSize; delete d.shoeSize; changed = true; }
  return changed;
}

  else if (act === 'grow-add') rerenderForm(d => { d[el.dataset.g] = [...(d[el.dataset.g] || []), {}]; });
  else if (act === 'grow-del') rerenderForm(d => { d[el.dataset.g].splice(+el.dataset.i, 1); });
  else if (act === 'addr-pick') addrPick(addrResults[+el.dataset.i]);
  else if (act === 'addr-check') addrCheck();
  else if (act === 'ins-skip') {
    const p = profileEntry(); const k = el.dataset.k;
    const s = new Set(p.data.insuranceSkip || []); s.has(k) ? s.delete(k) : s.add(k);
    p.data.insuranceSkip = [...s]; await saveEntry(p); route();

/* Navigation innerhalb der App. Die Adresszeile wird nachgeführt, wenn erlaubt,
   aber die App hängt nie davon ab (manche eingebettete Vorschauen laden sonst neu). */
let currentRoute = location.hash || '#/';
function go(href, replace = false) {
  currentRoute = href || '#/';
  try { history[replace ? 'replaceState' : 'pushState'](null, '', currentRoute); } catch { /* hier nicht erlaubt */ }
  route();
}
document.addEventListener('click', ev => {
  const a = ev.target.closest('a[href^="#"]');
  if (!a || ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.button) return;
  const href = a.getAttribute('href');
  if (href.startsWith('#/')) { ev.preventDefault(); go(href); }
  else { const target = document.getElementById(href.slice(1)); if (target) { ev.preventDefault(); target.scrollIntoView({ behavior: 'smooth' }); } }
});
window.addEventListener('popstate', () => { currentRoute = location.hash || '#/'; route(); });
window.addEventListener('hashchange', () => { if (location.hash !== currentRoute) { currentRoute = location.hash || '#/'; route(); } });

/* Probleme sichtbar anzeigen statt still zu scheitern */
function showError(err) {
  console.error(err);
  const msg = err?.stack || err?.message || String(err);
  let box = $('#errbox');
  if (!box) { box = document.createElement('div'); box.id = 'errbox'; box.className = 'card'; box.style.cssText = 'border-color:var(--danger);margin-bottom:16px'; main.prepend(box); }
  box.innerHTML = `<div class="sec-head"><h2 class="bad">⚠️ Da ist etwas schiefgelaufen</h2><button class="btn sm" onclick="location.reload()">Neu laden</button></div>
    <p class="small muted">Deine gespeicherten Daten sind nicht betroffen. Falls das wiederholt passiert, kopiere diesen Text und schick ihn Claude:</p><pre class="out">${h(msg)}</pre>`;
}
window.addEventListener('error', ev => showError(ev.error || ev.message));
window.addEventListener('unhandledrejection', ev => showError(ev.reason));

(async function init() {
  try {
    db = await openDB();
    navigator.storage?.persist?.();
  } catch (err) {
    db = null;
    document.body.insertAdjacentHTML('afterbegin', `<div class="notice" style="position:sticky;top:0;z-index:30;border-radius:0;background:var(--danger-soft);color:var(--danger)">
      <span>⚠️ <b>Vorschau-Modus: Es wird nichts gespeichert.</b> Dieses Fenster blockiert den Browser-Speicher. Öffne Lifebook direkt in Chrome, Edge, Safari oder Firefox, damit deine Daten erhalten bleiben.</span></div>`);
  }
  state.entries = await dbAll('entries');
  state.meta = Object.fromEntries((await dbAll('meta')).map(m => [m.key, m.value]));
  for (const e of state.entries) if (migrate(e)) await dbPut('entries', clean(e));
  if (db) await handleRedirect();
  route();
  if (state.meta._account && !tokenUsable() && canSignIn()) {
    // Anmeldung abgelaufen (Microsoft erlaubt bei Web-Apps max. 24 Std.): einmal still erneuern, ohne Rückfrage
    const last = +localStorage.getItem('lb_silent') || 0;
    if (Date.now() - last > 10 * 60 * 1000) { localStorage.setItem('lb_silent', Date.now()); return signIn('none'); }
    setSync('login');
  }
  syncNow();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - new Date(state.meta._lastSync || 0) > 60000) syncNow();
  });
  window.addEventListener('online', () => syncNow());
  // PC-Ordner und Jarvis: beim Start und wenn du zu Lifebook zurückkehrst (z.B. nach dem Ablegen einer Datei im Ordner)
  dirState.perm = await dirPermission(); renderDirChip();
  scheduleExtras(2500);
  window.addEventListener('focus', () => scheduleExtras(1200));
})();
